<body><div id="m"><div><div class="sp"></div><b>Abriendo tu propuesta…</b><small>Enlace privado · Rodrigo</small></div></div>
<script>(async function(){var m=document.getElementById('m'),K='k:'+location.pathname;
function fail(t){m.innerHTML='<div><b>'+t+'</b></div>'}
try{var k=location.hash.slice(1);try{if(k)sessionStorage.setItem(K,k);else k=sessionStorage.getItem(K)||''}catch(e){}
if(!k)return fail('A este enlace le falta su parte final. Ábrelo desde el mensaje original o pide que te lo reenvíen.');
if(!(window.crypto&&crypto.subtle&&window.TextDecoder))return fail('Tu navegador es demasiado antiguo para abrir esta propuesta. Prueba con Chrome o Safari actualizados.');
var raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')),function(c){return c.charCodeAt(0)});
var key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
var r=await fetch('d.bin',{cache:'no-cache'});if(!r.ok)return fail('Esta propuesta ya no está disponible.');
var b=new Uint8Array(await r.arrayBuffer());
var p=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b.subarray(0,12)},key,b.subarray(12)));
var n=new DataView(p.buffer).getUint32(0,true),meta=JSON.parse(new TextDecoder().decode(p.subarray(4,4+n))),base=4+n,h=meta.h;
meta.i.forEach(function(x){h=h.split('@@IMG:'+x.n+'@@').join(URL.createObjectURL(new Blob([p.subarray(base+x.o,base+x.o+x.l)],{type:'image/jpeg'})))});
document.open();document.write(h);document.close();
}catch(e){fail('No se ha podido abrir la propuesta: el enlace no está completo o ya no es válido.')}})();</script></body></html>
